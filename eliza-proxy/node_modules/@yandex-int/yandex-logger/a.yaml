service: frontend_build_platform
title: frontend/packages/yandex-logger

arcanum:
  review:
    auto_assign: true
    rules:
      - reviewers:
          name: developer
          # мы хотим автоматом назначать всю команду
          assign: 999
          ship: 1

ci:
  secret: sec-01h7zn16kdh6g6xxsfcrmk88v9 # robot-nots-releaser secrets
  runtime:
    sandbox:
      owner: FRONTEND_BUILD_PLATFORM
  releases:
    publish-package:
      title: "frontend: Publish @yandex-int/yandex-logger"
      flow: publish-package
      flow-vars-ui:
        schema:
          type: object
          required:
            - level
          properties:
            level:
              title: Increment level
              type: string
              enum:
                - patch
                - minor
                - major
              default: patch
      stages:
        - id: publish
          title: Publish
  flows:
    publish-package:
      jobs:
        publish:
          task: projects/frontend_build_platform/nots_publish
          stage: publish
          input:
            config:
              version_bump_level: ${flow-vars.level}
