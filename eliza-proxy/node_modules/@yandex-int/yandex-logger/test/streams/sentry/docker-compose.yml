version: '2'
services:
  sentry:
    image: sentry:latest
    ports:
      - "9000:9000"
    depends_on:
      - postgres
      - redis
    links:
      - postgres
      - redis
    environment:
      - SENTRY_REDIS_HOST=redis
      - SENTRY_POSTGRES_HOST=postgres
      - SENTRY_DB_USER=sentry
      - SENTRY_DB_NAME=sentry
      - SENTRY_DB_PASSWORD=sentry
      - SENTRY_SECRET_KEY='fake'
  sentry-cron:
    image: sentry:latest
    depends_on:
      - postgres
      - redis
    links:
      - postgres
      - redis
    command: [run, cron]
    environment:
      - SENTRY_REDIS_HOST=redis
      - SENTRY_POSTGRES_HOST=postgres
      - SENTRY_DB_USER=sentry
      - SENTRY_DB_NAME=sentry
      - SENTRY_DB_PASSWORD=sentry
      - SENTRY_SECRET_KEY='fake'
  sentry-worker:
    image: sentry:latest
    depends_on:
      - postgres
      - redis
    links:
      - postgres
      - redis
    command: [run, worker]
    environment:
      - SENTRY_REDIS_HOST=redis
      - SENTRY_POSTGRES_HOST=postgres
      - SENTRY_DB_USER=sentry
      - SENTRY_DB_NAME=sentry
      - SENTRY_DB_PASSWORD=sentry
      - SENTRY_SECRET_KEY='fake'
  redis:
    image: redis
  postgres:
    image: postgres
    environment:
      - POSTGRES_USER=sentry
      - POSTGRES_PASSWORD=sentry
      - POSTGRES_DB=sentry
